<svg id="menuSvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
            <defs>
                <!-- Açık Renk ve Enerjik Arka Plan Degradesi (Sarıdan Pembeye/Mora) -->
                <radialGradient id="bgGlow" cx="60%" cy="50%" r="75%">
                    <stop offset="0%" stop-color="#ffeaa7" /> <!-- Parlak sarı/krem -->
                    <stop offset="40%" stop-color="#ffb8b8" /> <!-- Tatlı pembe/şeftali -->
                    <stop offset="100%" stop-color="#a29bfe" /> <!-- Açık lila/mor -->
                </radialGradient>

                <!-- Hız çizgileri için beyaz/parlak degrade -->
                <linearGradient id="speedLine" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%" stop-color="rgba(255, 255, 255, 0)"/>
                    <stop offset="50%" stop-color="rgba(255, 255, 255, 0.8)"/>
                    <stop offset="100%" stop-color="rgba(255, 255, 255, 0)"/>
                </linearGradient>
                
                <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="8" result="blur" />
                    <feMerge>
                        <feMergeNode in="blur" />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>

                <!-- Açık arka planda karakterlerin belirgin olması için gölge -->
                <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="15" dy="15" stdDeviation="5" flood-color="#2d3436" flood-opacity="0.3"/>
                </filter>
